name: Journal Extension CI

on:
  push:
    branches:
      - "research/journal-extension*"
  pull_request:
    branches:
      - "research/journal-extension*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solidity-verification:
    name: Solidity Verification and Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check Solidity Formatting
        run: forge fmt --check

      - name: Compile Contracts
        run: forge build --sizes

      - name: Run Foundry Test Suite
        run: forge test -vvv

  python-verification:
    name: Python Linters, Tests, and Consistency Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff black pytest matplotlib pandas

      - name: Run Ruff Linter
        run: ruff check python tests

      - name: Run Black Formatter Check
        run: black --check python tests

      - name: Run Full Pytest Suite
        env:
          PYTHONPATH: .
        run: pytest -v tests

      - name: Run Baseline Consistency Check
        run: python python/check_consistency.py

      - name: Run Journal Claim Consistency and Zero Emoji Audit
        run: python python/check_journal_consistency.py

  paper-compilation:
    name: Paper Artifacts and LaTeX Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt matplotlib pandas

      - name: Generate Paper Tables and Figures
        run: python python/generate_paper_artifacts.py

      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          version: latest

      - name: Compile LaTeX Manuscript
        run: |
          cd paper
          tectonic main.tex

      - name: Upload Compiled Paper PDF
        uses: actions/upload-artifact@v4
        with:
          name: research-paper-pdf
          path: paper/main.pdf
          if-no-files-found: error
