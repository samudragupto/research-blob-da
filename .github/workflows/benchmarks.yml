name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "python/**"
      - "benchmarks/**"

jobs:
  run-benchmarks:
    name: Run Empirical Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Academic Datasets
        run: python python/generate_synthetic_data.py

      - name: Run Benchmark Experiment Suite
        run: python python/experiments.py

      - name: Generate Benchmark Figures
        run: python python/plot_results.py

      - name: Run On-Chain Gas Benchmark
        run: forge script script/BaselineBench.s.sol

      - name: Upload Benchmark CSVs and Figures
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: |
            benchmarks/*.csv
            benchmarks/*.png
            benchmarks/*.pdf
            docs/figures/*.png
            docs/figures/*.pdf
